services:
  api:
    image: frag-connector-fastapi
    build:
      context: .
      target: dev
    container_name: frag-connector-api
    working_dir: /app/
    env_file:
      - ./.env
    volumes:
      - "./app/:/app/"
    command: 'python -m uvicorn main:app --reload --host 0.0.0.0 --port 8000'
    restart: always
    ports:
      - ${MY_CONNECTOR_PORT}:8000
